server {
    listen 80;
    listen [::]:80;
    server_name preview.sistemayasnosti.com;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-sistemayasnosti-preview;
        try_files $uri =404;
    }
    location / {
        return 301 https://preview.sistemayasnosti.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name preview.sistemayasnosti.com;
    ssl_certificate /etc/letsencrypt/live/preview.sistemayasnosti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.sistemayasnosti.com/privkey.pem;
    root /var/www/sistemayasnosti-preview/current;
    index index.html;
    error_page 404 /404.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/sistemayasnosti-preview.access.log;
    error_log /var/log/nginx/sistemayasnosti-preview.error.log;
    # Сжатие и кэш только этого сайта (10.11.2026). add_header в location отменяет заголовки server, поэтому они повторены.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;
    location ~ "^/assets/.+[-.][A-Za-z0-9_-]{8}\.[A-Za-z0-9]+$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }
}

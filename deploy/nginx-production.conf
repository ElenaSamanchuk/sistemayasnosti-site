# =====================================================================
# Боевая конфигурация nginx для sistemayasnosti.com (статический сайт).
# Файл подготовлен заранее: сервера и DNS ещё нет, ничего не выкладывалось.
# Проверка после выкладки: bash tools/check-production-headers.sh
#
# ЧТО МЕНЯТЬ ПЕРЕД ВКЛЮЧЕНИЕМ (искать "ЗАМЕНИТЬ"):
#   1) root: каталог, куда распакована боевая сборка (SITE_ENV=production
#      npm run build:site), внутри лежат index.html, about/, assets/ и т.д.
#   2) ssl_certificate / ssl_certificate_key: сертификат на ОБА имени,
#      sistemayasnosti.com и www.sistemayasnosti.com.
#   3) путь в include к deploy/nginx-sales-redirects.conf на сервере.
# Секретов в файле нет и быть не должно.
#
# Файл рассчитан на размещение в http { include ...; } (conf.d / sites-enabled).
# =====================================================================

# --- 80 порт: всё уходит на https без www (301) ----------------------
server {
    listen 80;
    listen [::]:80;
    server_name sistemayasnosti.com www.sistemayasnosti.com;

    return 301 https://sistemayasnosti.com$request_uri;
}

# --- 443, www: 301 на основной адрес (Метрика и Kommo работают только без www) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sistemayasnosti.com;

    ssl_certificate     /ЗАМЕНИТЬ/путь/к/fullchain.pem;   # ЗАМЕНИТЬ
    ssl_certificate_key /ЗАМЕНИТЬ/путь/к/privkey.pem;     # ЗАМЕНИТЬ

    return 301 https://sistemayasnosti.com$request_uri;
}

# --- 443, основной сайт ----------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sistemayasnosti.com;

    ssl_certificate     /ЗАМЕНИТЬ/путь/к/fullchain.pem;   # ЗАМЕНИТЬ
    ssl_certificate_key /ЗАМЕНИТЬ/путь/к/privkey.pem;     # ЗАМЕНИТЬ

    root /ЗАМЕНИТЬ/var/www/sistemayasnosti/dist;          # ЗАМЕНИТЬ
    index index.html;

    # Относительные редиректы: не зависим от порта и схемы за прокси.
    absolute_redirect off;
    charset utf-8;

    # ---- Заголовки безопасности ----
    # ВАЖНО: add_header внутри location ОТМЕНЯЕТ все add_header уровня server.
    # Поэтому эти три строки повторены в каждом location, где есть свой
    # add_header (cache-control). Меняете здесь: меняйте во всех location ниже.
    # CSP НЕ добавляем: Метрике и Kommo нужны свои адреса.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- ЗАПРЕЩЕНО копировать с превью ----
    # На превью стоит "X-Robots-Tag: noindex". В боевой конфиг его переносить
    # НЕЛЬЗЯ: сайт пропадёт из поиска. Индексацией управляет сама сборка
    # (robots.txt и meta robots при SITE_ENV=production). Здесь noindex нет.

    # ---- Сжатие ----
    # text/html сжимается по умолчанию. woff2 и mp4/mp3/webp уже сжаты,
    # поэтому в списке их нет (font/woff2 не сжимаем).
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/css
        application/javascript
        text/javascript
        application/json
        image/svg+xml
        text/plain
        application/xml;

    # Секретные ссылки продаж (/pred, /pred_fl) - 302. Файл сгенерирован
    # tools/build-site.mjs, руками не править. Внутри только return, без
    # add_header, поэтому заголовки уровня server на них действуют.
    include /ЗАМЕНИТЬ/путь/к/deploy/nginx-sales-redirects.conf;   # ЗАМЕНИТЬ

    # ---- 404: страница из сборки (404.html), отдаётся со статусом 404 ----
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ---- Ассеты сборки с хешем в имени: на год, immutable ----
    # Имена вида index-dlvY2JUZ.css, AudioClub-BP8HNoN_.js (хеш из 8 знаков).
    location ~ "^/assets/.+[-.][A-Za-z0-9_-]{8}\.[A-Za-z0-9]+$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # Прочее в /assets/ (если вдруг без хеша): с перепроверкой.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ---- Картинки, видео, шрифты: 30 дней ----
    # Range для mp4 работает штатно (nginx отдаёт 206 для статики), mp4 не
    # сжимается gzip и не буферизуется специально. Ничего сюда не добавлять
    # вроде "proxy_*", "gzip on для video/*", "add_header Accept-Ranges none".
    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ---- /content (JSON и CSS страниц) и /embeds (аудиоклуб): без хешей в именах ----
    # Имена не меняются при обновлении, поэтому без immutable: браузер
    # перепроверяет через ETag. Range для mp3 в /embeds работает штатно.
    location ^~ /content/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ^~ /embeds/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ---- Страницы (HTML), robots.txt, sitemap.xml ----
    # Схема адресов: страницы лежат как каталоги (about/index.html), canonical
    # без косой черты (https://sistemayasnosti.com/about).
    #   /about   -> try_files: $uri (файла about нет) -> $uri/index.html найден,
    #               отдаётся ВНУТРЕННЕ, без редиректа. Цикла нет.
    #   /about/  -> rewrite ниже: 301 на /about (один шаг, дальше 200).
    #   /        -> index.html (regex ниже "/" не ловит: нужен хотя бы 1 знак + "/").
    #   нет такой страницы -> 404.html со статусом 404.
    # rewrite стоит ТОЛЬКО внутри location /, а не на уровне server: иначе он
    # сработал бы раньше точных location из nginx-sales-redirects.conf
    # (= /pred/) и получилась бы цепочка 301 -> 302.
    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
